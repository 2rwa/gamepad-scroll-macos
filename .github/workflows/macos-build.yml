name: macOS ARM64 build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Silicon
        run: |
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Build and test
        run: bash scripts/build-macos.sh
      - name: Upload macOS ARM64 app
        uses: actions/upload-artifact@v4
        with:
          name: GamepadScroll-macOS-arm64
          path: build/GamepadScroll-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30
